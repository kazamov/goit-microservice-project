applications:
  - name: django-app
    project: default
    source:
      repoURL: https://github.com/kazamov/goit-microservice-project.git
      path: charts/django-app
      targetRevision: final-project  # Use the current branch
      helm:
        valueFiles:
          - values.yaml
    destination:
      server: https://kubernetes.default.svc
      namespace: django-app
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=true
    # Add sync waves for proper ordering
    syncWave: 0

repositories:
  - name: goit-microservice
    url: https://github.com/kazamov/goit-microservice-project.git
    type: git
