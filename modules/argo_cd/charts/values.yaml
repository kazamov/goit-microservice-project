applications:
  - name: django-app
    project: default
    source:
      repoURL: https://github.com/kazamov/goit-microservice-project.git
      path: charts/django-app
      targetRevision: main
      helm:
        valueFiles:
          - values.yaml
    destination:
      server: https://kubernetes.default.svc
      namespace: django-app
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true

repositories:
  - name: goit-microservice
    url: https://github.com/kazamov/goit-microservice-project.git
