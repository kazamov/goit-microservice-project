image:
  repository: 127214174194.dkr.ecr.eu-central-1.amazonaws.com/django_app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8000

ingress:
  enabled: false

autoscaler:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  POSTGRES_PORT: "5432"
  POSTGRES_HOST: "django-app-postgresql"
  POSTGRES_USER: django_user
  POSTGRES_DB: django_db
  POSTGRES_PASSWORD: pass9764gd
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_SECRET_KEY: "your-secret-key-here-change-in-production"

# Bitnami PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "postgres_admin_pass"
    username: "django_user"
    password: "pass9764gd"
    database: "django_db"
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "gp2"
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
  metrics:
    enabled: false

